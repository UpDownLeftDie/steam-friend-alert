# fly.toml app configuration file generated for steam-friend-alert
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
#   fly launch --copy-config --name YOUR-APP-NAME
#   fly volumes create steam_alert_state --size 1
#   fly secrets set STEAM_API_KEY=... NTFY_TOKEN=...

app = "steam-friend-alert"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  POLL_INTERVAL_MINUTES = "5"
  STALE_AFTER_MINUTES = "720"
  NTFY_URL = "https://ntfy.sh"
  NTFY_TOPIC = "your-unique-topic-name"
  STATE_PATH = "/data/state.json"
  WATCHES = '''[{"steamId":"76561197960287930","label":"Robin"}]'''

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "steam_alert_state"
  destination = "/data"
